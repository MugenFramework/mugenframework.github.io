<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <!-- Horns -->
  <path d="M 26 28 L 16 2 L 38 20 Z" fill="#ff2244"/>
  <path d="M 74 28 L 84 2 L 62 20 Z" fill="#ff2244"/>

  <!-- Face -->
  <path d="M 14 36 C 14 22 26 20 50 20 C 74 20 86 22 86 36 L 86 72 C 86 90 66 104 50 106 C 34 104 14 90 14 72 Z"
        fill="rgba(255,34,68,0.07)" stroke="#ff2244" stroke-width="2.5"/>

  <!-- Eyebrows (thick, angled inward - angry) -->
  <line x1="16" y1="46" x2="43" y2="37" stroke="#ff2244" stroke-width="4" stroke-linecap="round"/>
  <line x1="57" y1="37" x2="84" y2="46" stroke="#ff2244" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="32" cy="56" rx="13" ry="9" fill="rgba(255,34,68,0.1)" stroke="#ff2244" stroke-width="2"/>
  <circle cx="32" cy="56" r="4.5" fill="#ff2244"/>
  <ellipse cx="68" cy="56" rx="13" ry="9" fill="rgba(255,34,68,0.1)" stroke="#ff2244" stroke-width="2"/>
  <circle cx="68" cy="56" r="4.5" fill="#ff2244"/>

  <!-- Nose (triangle, solid red) -->
  <path d="M 43 68 L 50 74 L 57 68 Z" fill="#ff2244" stroke="#ff2244" stroke-width="1" stroke-linejoin="round"/>

  <!-- Mouth (open, wide) -->
  <line x1="22" y1="82" x2="78" y2="82" stroke="#ff2244" stroke-width="1.5"/>
  <path d="M 22 82 Q 50 94 78 82" stroke="#ff2244" stroke-width="2"/>

  <!-- Fangs -->
  <rect x="33" y="82" width="7" height="10" rx="1" fill="#ff2244"/>
  <rect x="60" y="82" width="7" height="10" rx="1" fill="#ff2244"/>
</svg>
