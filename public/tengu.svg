        fill="rgba(255,34,68,0.07)" stroke="#ff2244" stroke-width="2.5"/>

  <!-- Rides front (horizontal) -->
  <line x1="36" y1="20" x2="64" y2="20" stroke="#ff2244" stroke-width="1" opacity="0.3"/>
  <line x1="39" y1="25" x2="61" y2="25" stroke="#ff2244" stroke-width="0.8" opacity="0.2"/>

  <!-- Sourcils en arche -->
  <path d="M 19 37 Q 29 31 39 35" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 61 35 Q 71 31 81 37" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Yeux en amande -->
  <path d="M 19 46 Q 29 40 39 46 Q 29 52 19 46 Z" fill="rgba(255,34,68,0.12)" stroke="#ff2244" stroke-width="1.8"/>
