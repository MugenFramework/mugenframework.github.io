  <path d="M 61 46 Q 71 40 81 46 Q 71 52 61 46 Z" fill="rgba(255,34,68,0.12)" stroke="#ff2244" stroke-width="1.8"/>
  <ellipse cx="71" cy="46" rx="4.5" ry="3" fill="#ff2244"/>

  <!-- Nez (tengu no hana) - rouge plein, raccourci -->
  <path d="M 43 54 L 45 100 L 50 106 L 55 100 L 57 54 Q 50 60 43 54 Z"
        fill="#ff2244" stroke="#ff2244" stroke-width="1.5" stroke-linejoin="round"/>

